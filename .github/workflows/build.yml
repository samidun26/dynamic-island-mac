name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_snapshots:
        description: Commit the rendered snapshots to docs/screenshots on this branch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || {
            echo "=================== ERRORS ==================="
            grep -E "error:" build.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -120
            exit 1
          }
          echo "=================== WARNINGS (app + core) ==================="
          grep -E "warning:" build.log | grep -v Vendor | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -80 || true

      - name: Unit tests
        run: swift test

      - name: Build app bundle (universal, ad-hoc signed)
        timeout-minutes: 15
        run: |
          # A v1.2.3 tag sets the app version; other builds are 1.0.0 with the run number.
          case "$GITHUB_REF" in refs/tags/v*) export VERSION="${GITHUB_REF_NAME#v}" ;; esac
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" UNIVERSAL=1 ./build.sh

      - name: Inspect bundle
        run: |
          find build/ponyhub.app -maxdepth 4 | sort
          lipo -info build/ponyhub.app/Contents/MacOS/ponyhub
          lipo -info build/ponyhub.app/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter
          codesign -dv build/ponyhub.app 2>&1 | head -5

      - name: Now Playing adapter smoke test
        run: |
          R=build/ponyhub.app/Contents
          set +e
          OUT=$(/usr/bin/perl "$R/Resources/mediaremote-adapter.pl" "$PWD/$R/Frameworks/MediaRemoteAdapter.framework" get --no-artwork 2>&1)
          echo "exit=$? output=$OUT"

      - name: Render snapshots (ImageRenderer)
        timeout-minutes: 5
        run: build/ponyhub.app/Contents/MacOS/ponyhub --snapshot "$PWD/snapshots"

      - name: Live window capture
        continue-on-error: true
        run: |
          for s in compact expanded multi; do
            build/ponyhub.app/Contents/MacOS/ponyhub --demo $s --print-window > win.txt 2>&1 &
            PID=$!
            sleep 3
            cat win.txt
            WID=$(sed -n 's/^NOTCHY_WINDOW_ID=//p' win.txt | head -1)
            [ -n "$WID" ] && screencapture -x -o -l "$WID" "snapshots/live-$s.png" || echo "no window id"
            # Where it sits on the real screen (the runner's display has no notch).
            screencapture -x -R 200,0,624,200 "snapshots/live-screen-$s.png" || true
            kill $PID || true
            sleep 1
          done
          ls -la snapshots

      - name: Process stats (idle CPU / memory)
        continue-on-error: true
        run: |
          # Real mode: all services on (Now Playing adapter stream, battery, calendar), nothing playing.
          open -n build/ponyhub.app
          sleep 10
          PID=$(pgrep -n -x ponyhub)
          echo "--- ponyhub (real services, idle)"
          top -l 4 -s 3 -pid $PID -stats pid,command,cpu,mem,idlew,threads | tail -2
          echo "--- what the main thread does while idle (sample, 3 s)"
          sample $PID 3 -file sample.txt > /dev/null 2>&1 || true
          awk '/Call graph:/{f=1} f' sample.txt | head -45 | cut -c1-160 || true
          echo "--- adapter stream (child perl process)"
          ps -o pid,ppid,%cpu,rss,command -A | grep '[m]ediaremote-adapter.pl' || echo "no adapter process"
          kill $PID || true
          sleep 1
          pgrep -fl mediaremote-adapter.pl && echo "adapter outlived the app" || echo "adapter exited with the app"

      - name: Publish snapshots to the branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_snapshots
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          cp snapshots/sheet-*.png snapshots/filmstrip-*.png snapshots/app-icon.png docs/screenshots/
          cp snapshots/notch-compact.png snapshots/notch-expanded.png snapshots/notch-multi.png snapshots/notch-home.png snapshots/notch-shelf.png snapshots/notch-clipboard.png snapshots/notch-pomodoroExpanded.png docs/screenshots/ || true
          cp snapshots/retro-compact.png snapshots/retro-expanded.png snapshots/retro-green.png snapshots/hud-volume.png snapshots/hud-brightness.png docs/screenshots/ || true
          cp snapshots/live-expanded.png snapshots/live-screen-*.png docs/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git commit -m "Update rendered snapshots [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Package
        run: |
          ditto -c -k --keepParent build/ponyhub.app ponyhub.zip
          shasum -a 256 ponyhub.zip | tee ponyhub.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
      - uses: actions/upload-artifact@v4
        with:
          name: ponyhub-app
          path: |
            ponyhub.zip
            ponyhub.zip.sha256
